<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowflake Decoder — Revenge Plugin</title>
  <style>
    :root {
      --bg: #0b0b10;
      --card: rgba(24, 24, 34, 0.78);
      --border: rgba(168, 85, 247, 0.28);
      --accent: #a855f7;
      --accent-2: #ec4899;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1f1235, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .section { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .row { display: flex; gap: 8px; }

    input {
      flex: 1;
      background: rgba(10, 10, 16, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.9; }

    .result {
      background: rgba(10, 10, 16, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
    }

    .result.visible { display: block; }
    .result span { color: var(--muted); }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Snowflake Decoder</h1>
    <p class="sub">Revenge plugin &amp; web decoder for Discord Snowflake IDs.</p>

    <div class="section">
      <label>Plugin Install URL (Revenge)</label>
      <div class="row">
        <input id="manifestUrl" type="text" readonly />
        <button id="copyBtn" type="button">Copy</button>
      </div>
    </div>

    <div class="section">
      <label for="snowflakeInput">Decode a Snowflake ID</label>
      <div class="row">
        <input id="snowflakeInput" type="text" placeholder="e.g. 175928847299117063" />
        <button id="decodeBtn" type="button">Decode</button>
      </div>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script>
    const DISCORD_EPOCH = 1420070400000n;

    const manifestInput = document.getElementById("manifestUrl");
    const copyBtn = document.getElementById("copyBtn");
    const snowflakeInput = document.getElementById("snowflakeInput");
    const decodeBtn = document.getElementById("decodeBtn");
    const resultBox = document.getElementById("result");

    manifestInput.value = new URL("manifest.json", window.location.href).href;

    copyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(manifestInput.value);
      copyBtn.textContent = "Copied!";
      setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
    });

    function decode() {
      const raw = snowflakeInput.value.trim();
      resultBox.classList.add("visible");

      if (!/^\d{17,20}$/.test(raw)) {
        resultBox.innerHTML = `<div class="error">Enter a valid 17–20 digit Discord Snowflake ID.</div>`;
        return;
      }

      const id = BigInt(raw);
      const timestampMs = Number((id >> 22n) + DISCORD_EPOCH);
      const workerId = Number((id & 0x3e0000n) >> 17n);
      const processId = Number((id & 0x1f000n) >> 12n);
      const increment = Number(id & 0xfffn);
      const date = new Date(timestampMs);

      resultBox.innerHTML = `
        <div><span>Created (Local):</span> ${date.toLocaleString()}</div>
        <div><span>Created (UTC):</span> ${date.toISOString()}</div>
        <div><span>Worker ID:</span> ${workerId}</div>
        <div><span>Process ID:</span> ${processId}</div>
        <div><span>Increment:</span> ${increment}</div>
      `;
    }

    decodeBtn.addEventListener("click", decode);
    snowflakeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") decode();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snowflake Decoder — Revenge Plugin</title>
  <style>
    :root {
      --bg: #0b0b10;
      --card: rgba(24, 24, 34, 0.78);
      --border: rgba(168, 85, 247, 0.28);
      --accent: #a855f7;
      --accent-2: #ec4899;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1f1235, var(--bg) 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .section { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .row { display: flex; gap: 8px; }

    input {
      flex: 1;
      background: rgba(10, 10, 16, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.9; }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
    }

    .result {
      background: rgba(10, 10, 16, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
      margin-bottom: 20px;
    }

    .result.visible { display: block; }
    .result span { color: var(--muted); }
    .error { color: #f87171; }

    .file-box {
      background: rgba(10, 10, 16, 0.75);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .file-actions { display: flex; gap: 6px; }

    pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: #d1d5db;
